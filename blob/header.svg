<svg fill="none" viewBox="0 0 1000 30" width="100%" height="30" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes gradient {
          0%   { background-position: 0% 50%; }
          50%  { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }

        /* 9 keywords x 4s each = 36s cycle. Each word owns 1/9 (11.11%) of the timeline. */
        @keyframes keyword {
          0%     { opacity: 0; transform: translateY(6px); }
          1.5%   { opacity: 1; transform: translateY(0); }
          9.6%   { opacity: 1; transform: translateY(0); }
          11.11% { opacity: 0; transform: translateY(-6px); }
          100%   { opacity: 0; }
        }

        .container {
          background: linear-gradient(-45deg, #0061ff, #4d2fff, #b620e0, #ff00cc);
          background-size: 400% 400%;
          animation: gradient 12s ease infinite;

          position: relative;
          width: 100%;
          height: 30px;
          overflow: hidden;
          color: white;

          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .kw {
          position: absolute;
          top: 3px;
          font-size: 18px;
          font-weight: 700;
          line-height: 24px;
          white-space: nowrap;
          opacity: 0;
          text-shadow: 0 1px 6px rgba(0, 0, 0, 0.35);
          animation: keyword 36s linear infinite;
        }

        /* Pre-computed "random" horizontal positions along the 1000px strip, one slot every 4s */
        .kw:nth-child(1) { left: 30px;  animation-delay: 0s; }
        .kw:nth-child(2) { left: 690px; animation-delay: 4s; }
        .kw:nth-child(3) { left: 340px; animation-delay: 8s; }
        .kw:nth-child(4) { left: 150px; animation-delay: 12s; }
        .kw:nth-child(5) { left: 890px; animation-delay: 16s; }
        .kw:nth-child(6) { left: 500px; animation-delay: 20s; }
        .kw:nth-child(7) { left: 240px; animation-delay: 24s; }
        .kw:nth-child(8) { left: 780px; animation-delay: 28s; }
        .kw:nth-child(9) { left: 430px; animation-delay: 32s; }

        @media (prefers-reduced-motion) {
          .container { animation: none; }
          .kw { animation: none; opacity: 0.9; }
        }
      </style>

      <div class="container">
        <span class="kw">.Net Core</span>
        <span class="kw">Minimal API</span>
        <span class="kw">OpenApi</span>
        <span class="kw">Node.js</span>
        <span class="kw">Bun</span>
        <span class="kw">Visual Studio</span>
        <span class="kw">Visual Code</span>
        <span class="kw">Claude CLI</span>
        <span class="kw">Azure CLI</span>
      </div>
    </div>
  </foreignObject>
</svg>
